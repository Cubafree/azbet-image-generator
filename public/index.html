<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banner Gen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <!-- Left panel: form + preview -->
    <div class="panel panel-left">
      <header class="app-header">
        <h1>Banner Gen</h1>
        <span class="badge">Internal Tool</span>
      </header>

      <div class="form-section">

        <!-- 1. Vertical -->
        <span class="field-label">Vertical</span>
        <div class="radio-group" id="verticalGroup">
          <label class="radio-card">
            <input type="radio" name="vertical" value="casino" checked />
            <span>🎰 Casino</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="vertical" value="sport" />
            <span>⚽ Sport</span>
          </label>
        </div>

        <!-- 2. Country -->
        <span class="field-label">Country</span>
        <div class="radio-group" id="countryGroup">
          <label class="radio-card">
            <input type="radio" name="country" value="egypt" checked />
            <span>Egypt <em>(مصر)</em></span>
          </label>
          <label class="radio-card">
            <input type="radio" name="country" value="morocco" />
            <span>Morocco <em>(المغرب)</em></span>
          </label>
          <label class="radio-card">
            <input type="radio" name="country" value="algeria" />
            <span>Algeria <em>(الجزائر)</em></span>
          </label>
          <label class="radio-card">
            <input type="radio" name="country" value="libya" />
            <span>Libya <em>(ليبيا)</em></span>
          </label>
        </div>

        <!-- 3. Subject -->
        <span class="field-label">Subject</span>
        <div class="radio-group" id="subjectGroup">
          <label class="radio-card">
            <input type="radio" name="subject" value="woman" checked />
            <span>👩 Woman</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="subject" value="man" />
            <span>👨 Man</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="subject" value="object" />
            <span>🎯 Object</span>
          </label>
        </div>

        <!-- 4. Sport Type (conditional) -->
        <div id="sportTypeRow">
          <span class="field-label">Sport type</span>
          <div class="radio-group" id="sportTypeGroup">
            <label class="radio-card">
              <input type="radio" name="sportType" value="football" checked />
              <span>⚽ Football</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="sportType" value="tennis" />
              <span>🎾 Tennis</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="sportType" value="basketball" />
              <span>🏀 Basketball</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="sportType" value="general" />
              <span>🏆 General</span>
            </label>
          </div>
        </div>

        <!-- 5. Accent Color -->
        <span class="field-label">Accent color</span>
        <div class="color-group" id="colorGroup">
          <label class="color-card" title="Cyan / Electric Blue">
            <input type="radio" name="accentColor" value="cyan" checked />
            <span class="color-swatch" style="background:#00d4ff"></span>
            <span class="color-name">Cyan</span>
          </label>
          <label class="color-card" title="Emerald Green">
            <input type="radio" name="accentColor" value="green" />
            <span class="color-swatch" style="background:#00e676"></span>
            <span class="color-name">Green</span>
          </label>
          <label class="color-card" title="Violet Purple">
            <input type="radio" name="accentColor" value="purple" />
            <span class="color-swatch" style="background:#8b5cf6"></span>
            <span class="color-name">Purple</span>
          </label>
        </div>

        <!-- 6. Scene Prompt (optional) -->
        <label class="field-label" for="scenePrompt">Scene prompt <span class="optional">optional</span></label>
        <textarea
          id="scenePrompt"
          class="input-field"
          rows="3"
          placeholder="Optional: describe what you want to see (e.g. woman in kaftan holding slot reel, warm Moroccan riad)"
        ></textarea>

        <!-- 7. Banner Text -->
        <label class="field-label" for="bannerText">Banner text <span class="required">required</span></label>
        <textarea
          id="bannerText"
          class="input-field"
          rows="2"
          placeholder="Text for banner overlay (Arabic or French)"
        ></textarea>

        <button id="generateBtn" class="btn btn-primary" onclick="generate()">
          <span class="btn-icon">✦</span> Generate
        </button>
      </div>

      <!-- Loading state -->
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Generating image… this may take 20–40 seconds</p>
      </div>

      <!-- Error -->
      <div id="error" class="error-box hidden"></div>

      <!-- Preview -->
      <div id="preview" class="preview hidden">
        <div class="preview-header">
          <span class="preview-label">Preview</span>
          <div class="preview-actions">
            <button class="btn btn-confirm" onclick="confirmGen()">✓ Confirm</button>
            <button class="btn btn-regen" onclick="regenerate()">↻ Regenerate</button>
          </div>
        </div>
        <div class="preview-image-wrap">
          <img id="previewImg" src="" alt="Generated banner" />
        </div>
        <div class="preview-urls">
          <div class="preview-url">
            <span class="url-label">Final URL</span>
            <a id="previewUrl" href="#" target="_blank" class="url-value">—</a>
            <button class="copy-btn" onclick="copyUrl('previewUrl')" title="Copy URL">⎘</button>
          </div>
          <div class="preview-url" id="rawUrlRow" style="display:none">
            <span class="url-label">Raw image</span>
            <a id="rawUrl" href="#" target="_blank" class="url-value">—</a>
            <button class="copy-btn" onclick="copyUrl('rawUrl')" title="Copy URL">⎘</button>
          </div>
        </div>
        <div class="preview-download">
          <a id="downloadBtn" href="#" download="banner.jpg" class="btn btn-download" target="_blank">
            ↓ Download
          </a>
        </div>
      </div>

    </div>

    <!-- Right panel: history table -->
    <div class="panel panel-right">
      <div class="table-header">
        <h2>Generation history</h2>
        <button class="refresh-btn" onclick="loadHistory()" title="Refresh">↻</button>
      </div>
      <div class="table-wrap">
        <table id="historyTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Vertical</th>
              <th>Country</th>
              <th>Subject</th>
              <th>Banner text</th>
              <th>Status</th>
              <th>URL</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="8" class="empty">No generations yet</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
