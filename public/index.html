<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banner Gen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">

    <!-- ── Левая панель: только форма ── -->
    <div class="panel panel-left">
      <header class="app-header">
        <h1>Banner Gen</h1>
        <span class="badge">Внутренний инструмент</span>
      </header>

      <div class="form-section">

        <!-- 1. Вертикаль -->
        <span class="field-label">Вертикаль</span>
        <div class="radio-group" id="verticalGroup">
          <label class="radio-card">
            <input type="radio" name="vertical" value="casino" checked />
            <span>🎰 Казино</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="vertical" value="sport" />
            <span>⚽ Спорт</span>
          </label>
        </div>

        <!-- 2. Страна -->
        <span class="field-label">Страна</span>
        <div class="radio-group" id="countryGroup">
          <label class="radio-card">
            <input type="radio" name="country" value="egypt" checked />
            <span>Египет <em>(مصر)</em></span>
          </label>
          <label class="radio-card">
            <input type="radio" name="country" value="morocco" />
            <span>Марокко <em>(المغرب)</em></span>
          </label>
          <label class="radio-card">
            <input type="radio" name="country" value="algeria" />
            <span>Алжир <em>(الجزائر)</em></span>
          </label>
          <label class="radio-card">
            <input type="radio" name="country" value="libya" />
            <span>Ливия <em>(ليبيا)</em></span>
          </label>
        </div>

        <!-- 3. Персонаж -->
        <span class="field-label">Персонаж</span>
        <div class="radio-group" id="subjectGroup">
          <label class="radio-card">
            <input type="radio" name="subject" value="woman" checked />
            <span>👩 Женщина</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="subject" value="man" />
            <span>👨 Мужчина</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="subject" value="object" />
            <span>🎯 Объект</span>
          </label>
        </div>

        <!-- 4. Вид спорта (условный) -->
        <div id="sportTypeRow">
          <span class="field-label">Вид спорта</span>
          <div class="radio-group" id="sportTypeGroup">
            <label class="radio-card">
              <input type="radio" name="sportType" value="football" checked />
              <span>⚽ Футбол</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="sportType" value="tennis" />
              <span>🎾 Теннис</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="sportType" value="basketball" />
              <span>🏀 Баскетбол</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="sportType" value="general" />
              <span>🏆 Универсальный</span>
            </label>
          </div>
        </div>

        <!-- 5. Акцентный цвет -->
        <span class="field-label">Акцентный цвет</span>
        <div class="color-group" id="colorGroup">
          <label class="color-card" title="Синий / Электрик">
            <input type="radio" name="accentColor" value="cyan" checked />
            <span class="color-swatch" style="background:#00d4ff"></span>
            <span class="color-name">Синий</span>
          </label>
          <label class="color-card" title="Изумрудный">
            <input type="radio" name="accentColor" value="green" />
            <span class="color-swatch" style="background:#00e676"></span>
            <span class="color-name">Зелёный</span>
          </label>
          <label class="color-card" title="Фиолетовый">
            <input type="radio" name="accentColor" value="purple" />
            <span class="color-swatch" style="background:#8b5cf6"></span>
            <span class="color-name">Фиолетовый</span>
          </label>
          <label class="color-card" title="Золотой / Люкс">
            <input type="radio" name="accentColor" value="gold" />
            <span class="color-swatch" style="background:#ffd700"></span>
            <span class="color-name">Золотой</span>
          </label>
        </div>

        <!-- 6. Описание сцены -->
        <label class="field-label" for="scenePrompt">Описание сцены <span class="optional">необязательно</span></label>
        <textarea
          id="scenePrompt"
          class="input-field"
          rows="2"
          placeholder="Опишите что хотите увидеть (например: женщина в кафтане держит барабан слота, марокканский риад)"
        ></textarea>

        <!-- 7. Строка 1 — простой белый текст без подложки -->
        <label class="field-label" for="line1Input">Строка 1 <span class="optional">без подложки, необязательно</span></label>
        <input
          id="line1Input"
          type="text"
          class="input-field"
          placeholder="BONUS DE DÉPÔT"
        />

        <!-- 8. Строка 2 — текст на плашке -->
        <label class="field-label" for="line2Input">Строка 2 <span class="required">на плашке, обязательно</span></label>
        <input
          id="line2Input"
          type="text"
          class="input-field"
          placeholder="100% + 30 TOURS"
        />

        <!-- 9. Стиль плашки -->
        <span class="field-label">Стиль плашки</span>
        <div class="radio-group">
          <label class="radio-card">
            <input type="radio" name="plashkaStyle" value="filled" checked />
            <span>Залитая</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="plashkaStyle" value="bordered" />
            <span>Контурная</span>
          </label>
        </div>

        <!-- 10. Доп. строка (пилл) -->
        <label class="toggle-label">
          <input type="checkbox" id="line3Toggle" onchange="toggleLine3()" />
          <span>Добавить доп. строку (пилл)</span>
        </label>
        <div id="line3Row" class="hidden">
          <label class="field-label" for="line3">Доп. строка</label>
          <input id="line3" type="text" class="input-field" placeholder="78K + 150FS" />
        </div>

        <button id="generateBtn" class="btn btn-primary" onclick="generate()">
          <span class="btn-icon">✦</span> Генерировать
        </button>
      </div>

      <!-- Загрузка -->
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Генерация… 20–40 секунд</p>
      </div>

      <!-- Ошибка -->
      <div id="error" class="error-box hidden"></div>
    </div>

    <!-- ── Правая панель: превью + история ── -->
    <div class="panel panel-right">

      <!-- Превью (скрыто до генерации) -->
      <div id="previewSection" class="preview-section hidden">
        <div class="preview-inner">
          <div class="preview-img-col">
            <img id="previewImg" src="" alt="Баннер" />
          </div>
          <div class="preview-controls-col">
            <p class="preview-section-title">Результат</p>
            <div class="preview-action-btns">
              <button class="btn btn-confirm" onclick="confirmGen()">✓ Подтвердить</button>
              <button class="btn btn-regen" onclick="regenerate()">↻ Перегенерировать</button>
            </div>
            <div class="preview-url-block">
              <span class="url-label">URL</span>
              <a id="previewUrl" href="#" target="_blank" class="url-value">—</a>
              <button class="copy-btn" onclick="copyUrl('previewUrl')" title="Скопировать">⎘</button>
            </div>
            <a id="downloadBtn" href="#" download="banner.jpg" class="btn btn-download" target="_blank">
              ↓ Скачать
            </a>
          </div>
        </div>
      </div>

      <!-- История -->
      <div class="table-header">
        <h2>История генераций</h2>
        <button class="refresh-btn" onclick="loadHistory()" title="Обновить">↻</button>
      </div>
      <div class="table-wrap">
        <table id="historyTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Вертикаль</th>
              <th>Страна</th>
              <th>Персонаж</th>
              <th>Строка 2</th>
              <th>Статус</th>
              <th>URL</th>
              <th>Создано</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="8" class="empty">Генераций пока нет</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
